name: whisper-update-check

# Daily: when whisper.cpp has a numbered release (v1.x.y) newer than the build pinned in
# engine.rs, wait until a b#### build that includes it has the Windows zips we download.
# Then push an engine/<build> branch with RELEASE bumped and start the engine workflow on
# it, which builds Vulkan, fills in the hashes, smoke-tests, and opens a PR plus an issue.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          upstream=ggml-org/whisper.cpp
          pinned=$(sed -n 's/^const RELEASE: &str = "\(.*\)";/\1/p' src-tauri/src/transcription/engine.rs)
          [ -n "$pinned" ] || { echo "::error::RELEASE not found in engine.rs"; exit 1; }
          latest=$(gh release list -R $upstream --exclude-pre-releases -L 20 --json tagName \
            -q '[.[] | select(.tagName | test("^v[0-9]"))][0].tagName')
          # "ahead" means the latest release has commits our pinned build doesn't.
          status=$(gh api "repos/$upstream/compare/$pinned...$latest" -q .status)
          echo "Pinned $pinned, latest $latest: $status"
          [ "$status" = "ahead" ] || exit 0

          # The oldest b#### build that includes $latest and has both Windows zips.
          build=
          for tag in $(gh release list -R $upstream -L 30 --json tagName -q '.[].tagName | select(test("^b[0-9]+$"))'); do
            case $(gh api "repos/$upstream/compare/$latest...$tag" -q .status) in
              identical|ahead) ;;
              *) break ;;
            esac
            assets=$(gh release view "$tag" -R $upstream --json assets -q '.assets[].name')
            if grep -qx whisper-bin-x64.zip <<<"$assets" && grep -qx whisper-bin-win-cuda-12.4.0-x64.zip <<<"$assets"; then
              build=$tag
            fi
          done
          if [ -z "$build" ]; then
            echo "::notice::No Windows build of $latest yet."
            exit 0
          fi

          branch="engine/$build"
          if gh api "repos/$GH_REPO/branches/$branch" >/dev/null 2>&1; then
            echo "::notice::$branch already exists."
            exit 0
          fi
          sed -i "s/^const RELEASE: &str = \".*\";/const RELEASE: \&str = \"$build\";/" src-tauri/src/transcription/engine.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Transcription engine: whisper.cpp $latest ($build)"
          git push origin "HEAD:refs/heads/$branch"
          gh workflow run engine.yml --ref "$branch" -f version="$latest"
          echo "::notice::Pushed $branch and started the engine workflow."
