name: engine

# Builds the Vulkan engine for the whisper.cpp build pinned in engine.rs (RELEASE), since
# whisper.cpp doesn't publish one for Windows, and smoke-tests every engine the app downloads.
#
# The Vulkan zip goes to the `engine-<RELEASE>` pre-release in this repo (pre-release, so the
# app updater, the site and #updates ignore it). It's built once per RELEASE: if the zip is
# already there, the build is skipped. Delete the release to rebuild.
#
# RELEASE bumps normally come from whisper-update-check, which pushes an engine/<build> branch
# and starts this with `version` set. On any branch other than release, this writes the
# SHA256 values into asset_sha256 and commits them. With `version` set and the smoke test
# passing, it opens a PR to release and an issue that the PR closes. On release, a hash that
# doesn't match fails the smoke test.
on:
  push:
    paths:
      - src-tauri/src/transcription/engine.rs
      - .github/workflows/engine.yml
      - .github/scripts/engine_check.py
  workflow_dispatch:
    inputs:
      version:
        description: whisper.cpp release (v1.x.y) the pinned build matches; opens the PR
        required: false

env:
  VULKAN_SDK_VERSION: 1.4.357.0

jobs:
  vulkan:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(sed -n 's/^const RELEASE: &str = "\(.*\)";/\1/p' src-tauri/src/transcription/engine.rs)
          [ -n "$release" ] || { echo "::error::RELEASE not found in engine.rs"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if gh release view "engine-$release" --json assets -q '.assets[].name' 2>/dev/null | grep -qx whisper-bin-win-vulkan-x64.zip; then
            echo "::notice::engine-$release already has the Vulkan zip; not rebuilding."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vulkan SDK
        if: steps.check.outputs.build == 'true'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_SDK_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_SDK_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_SDK_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_SDK_VERSION}\bin"

      - uses: actions/checkout@v5
        if: steps.check.outputs.build == 'true'
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ steps.check.outputs.release }}
          path: whisper.cpp

      # Same options as whisper.cpp's own Windows release build, plus Vulkan. With
      # GGML_BACKEND_DL each backend is its own DLL, so without a Vulkan driver the
      # CPU backend still loads.
      - name: Build
        if: steps.check.outputs.build == 'true'
        run: |
          cmake -S whisper.cpp -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_SDL2=OFF
          cmake --build build --config Release -j 4

      - name: Zip
        if: steps.check.outputs.build == 'true'
        run: |
          New-Item -ItemType Directory -Force Release | Out-Null
          Copy-Item build/bin/Release/whisper-server.exe, build/bin/Release/whisper-cli.exe, build/bin/Release/*.dll Release/
          Get-ChildItem Release | Format-Table Name, Length
          Compress-Archive -Path Release -DestinationPath whisper-bin-win-vulkan-x64.zip

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.build == 'true'
        with:
          name: whisper-bin-win-vulkan-x64
          path: whisper-bin-win-vulkan-x64.zip
          retention-days: 7

      - name: Smoke test before upload (CPU fallback, the runner has no GPU)
        if: steps.check.outputs.build == 'true'
        run: python -I .github/scripts/engine_check.py --zip whisper-bin-win-vulkan-x64.zip --work engine-check

      - name: Upload
        if: steps.check.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.check.outputs.release }}
        run: |
          tag="engine-$RELEASE"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Transcription engines for whisper.cpp $RELEASE" \
              --notes "Engines d-scribe downloads that whisper.cpp doesn't publish itself. Built by .github/workflows/engine.yml from whisper.cpp $RELEASE with Vulkan SDK $VULKAN_SDK_VERSION. Not an app release."
          fi
          gh release upload "$tag" whisper-bin-win-vulkan-x64.zip
          echo "Vulkan zip SHA256: $(sha256sum whisper-bin-win-vulkan-x64.zip | cut -d' ' -f1)"
          echo "Size: $(stat -c %s whisper-bin-win-vulkan-x64.zip) bytes"

  # Off release: write the SHA256 of each download into engine.rs and commit it.
  hashes:
    needs: vulkan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - if: github.ref_name != 'release'
        run: python -I .github/scripts/engine_check.py --update-hashes --work engine-check
      - id: commit
        run: |
          if [ "$GITHUB_REF_NAME" != release ] && ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -am "Engine hashes for ${GITHUB_REF_NAME#engine/}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Downloads each engine the way the app does and checks it against engine.rs.
  smoke-test:
    needs: hashes
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: cpu
          - kind: vulkan
          - kind: cuda
            args: --hash-only
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.hashes.outputs.sha }}
      - run: python -I .github/scripts/engine_check.py --kind ${{ matrix.kind }} --work engine-check ${{ matrix.args }}

  # A bump branch that passed: open a PR to release, plus an issue the PR closes. Merging
  # doesn't publish anything; the new engine ships with the next version bump.
  pull-request:
    needs: smoke-test
    if: inputs.version != '' && github.ref_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ] || exit 0
          build=${BRANCH#engine/}
          issue=$(gh issue create --title "Transcription engine update to whisper.cpp $VERSION is ready" --body "whisper.cpp [$VERSION](https://github.com/ggml-org/whisper.cpp/releases/tag/$VERSION) has Windows builds (\`$build\`). The bump is built, smoke-tested and waiting in a PR. Merge it to ship it with the next app release.")
          gh pr create --base release --head "$BRANCH" \
            --title "Transcription engine updated to whisper.cpp $VERSION" \
            --body "Moves \`RELEASE\` to \`$build\`, the Windows build of whisper.cpp [$VERSION](https://github.com/ggml-org/whisper.cpp/releases/tag/$VERSION). The Vulkan zip is built and every engine passed the smoke test (Vulkan only on its CPU fallback).

          Before merging, ask a tester with AMD or Intel graphics to try the Vulkan engine. Merging doesn't publish a release; this ships with the next version bump.

          Closes #${issue##*/}"
