name: publish

on:
  push:
    branches:
      - release
    paths-ignore:
      - site/**
      - .github/workflows/pages.yml
      - .github/workflows/discord-updates.yml
      - .github/scripts/**
      - .github/release.yml
      - "*.md"
  workflow_dispatch:

jobs:
  # Only build when this version isn't published yet, so a push without a version bump
  # can't overwrite the files of a release people already have.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$(gh release view "app-v$version" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "::notice::app-v$version is already published. Bump the version to build a new release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@action-v0.6.1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: app-v__VERSION__
          releaseName: 'd-scribe v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Release notes list the PRs merged since the last published release (see .github/release.yml).
      # discord-updates.yml posts them to #updates when the release is published.
      - name: release notes from merged PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: app-v${{ steps.tauri.outputs.appVersion }}
        run: |
          prev=$(gh release view --json tagName -q .tagName || true)
          if [ "$prev" = "$TAG" ]; then
            echo "$TAG is already published; leaving its notes alone."
            exit 0
          fi
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$prev" ]; then args+=(-f previous_tag_name="$prev"); fi
          gh api "repos/$GH_REPO/releases/generate-notes" "${args[@]}" -q .body > notes.md
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md
