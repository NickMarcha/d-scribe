[package]
name = "fake-discord"
version = "0.1.0"
description = "A stand-in for the Discord desktop app, for testing d-scribe without Discord"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
publish = false

[features]
default = ["audio"]
# Plays speakers' WAV clips (or tones) on the default output device.
audio = ["dep:rodio"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
hound = "3"
tiny_http = "0.12"
rodio = { version = "0.19", default-features = false, features = ["wav"], optional = true }
